[package]
name = "rimefront_net"
version = "1.6.0"
edition = "2024"
rust-version = "1.100"
description = "Network battles of Rimefront: the lockstep session, its links, the relay and the dedicated server"
repository = "https://github.com/mbocek/rimefront"

[[bin]]
name = "rimefront-server"
path = "src/bin/server.rs"

[[bin]]
name = "rimefront-world-soak"
path = "src/bin/world_soak.rs"

[dependencies]
rimefront_sim = { path = "../sim" }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_state",
    "bevy_color",
    "bevy_log",
    "multi_threaded",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.4", features = ["termination"] }
flate2 = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
ring = "0.17"
rand = "0.10.4"
libc = "0.2"
