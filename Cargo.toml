[package]
name = "rimefront"
default-run = "rimefront"
version = "2.0.1"
edition = "2024"
rust-version = "1.100"
description = "Rimefront - an original real-time strategy game (c) 2026"
repository = "https://github.com/mbocek/rimefront"

[[bin]]
name = "rimefront"
path = "src/main.rs"

[workspace]
members = [".", "crates/sim", "crates/net"]

[dependencies]
rimefront_sim = { path = "crates/sim" }
rimefront_net = { path = "crates/net" }
bevy = { version = "0.20.1", features = ["jpeg"] }
rand = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# Already in the build through rustls; hashes downloaded updates against SHA256SUMS.txt.
ring = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls-pki-types = { version = "1", features = ["std"] }
