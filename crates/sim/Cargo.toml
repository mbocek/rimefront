[package]
name = "rimefront_sim"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
description = "The battle simulation of Rimefront: rules, map and levels, without drawing, sound or interface"
repository = "https://github.com/mbocek/rimefront"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_state",
    "bevy_color",
    "bevy_log",
    "multi_threaded",
] }
libm = "0.2"
pathfinding = "4.16"
rand = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
