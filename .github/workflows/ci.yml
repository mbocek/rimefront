name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting, lints and tests
        run: make check

  package:
    # Pushes to main only run the checks; a version tag, or a manual run, builds the packages.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            executable: rimefront
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            executable: rimefront
            dmg: true
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            executable: rimefront
            dmg: true
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            executable: rimefront.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build the game
        run: cargo build --release --bin rimefront --target ${{ matrix.target }}

      # Networked players must compute the same battle on every processor and operating system.
      - name: Same battle as the recorded one
        if: runner.os == 'Windows' || matrix.platform == 'macos-arm64'
        run: cargo test --release --target ${{ matrix.target }} --test cross_platform

      # Signing steps skip themselves while the certificates are not configured; see docs/signing.md.
      - name: Sign the Windows executable
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: tools/sign_windows.sh "$BINARY"

      - name: Bundle binary and assets
        run: tools/package.sh ${{ matrix.platform }} "$BINARY"

      - name: Build, sign and notarize the macOS disk image
        if: matrix.dmg
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package_dmg.sh ${{ matrix.platform }} "$BINARY"

      - uses: actions/upload-artifact@v7
        with:
          name: rimefront-${{ matrix.platform }}
          path: dist/rimefront-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
